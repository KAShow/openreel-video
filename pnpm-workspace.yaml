packages:
  - "apps/*"
  - "packages/*"
overrides:
  # أمني: protobufjs >=7.5.4 الحرج (تنفيذ كود اعتباطي GHSA عبر onnxruntime/posthog)
  protobufjs: ">=7.5.5"
patchedDependencies:
  "@ffmpeg/core-mt@0.12.6": "patches/@ffmpeg__core-mt@0.12.6.patch"
  "@ffmpeg/core@0.12.6": "patches/@ffmpeg__core@0.12.6.patch"
onlyBuiltDependencies:
  - electron
ignoredBuiltDependencies:
  - core-js
  - esbuild
  - onnxruntime-node
  - protobufjs
  - sharp
  - workerd
allowBuilds:
  core-js: false
  electron: true
  esbuild: false
  onnxruntime-node: false
  protobufjs: false
  sharp: false
  workerd: false
